<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clicker</title>
<style>
  :root {
    --bg: #eceef3;
    --panel: #ffffff;
    --ink: #1c2233;
    --muted: #6b7388;
    --line: #dde1ea;
    --accent: #3d4dff;
    --accent-deep: #2631c9;
    --accent-soft: #e4e7ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 1fr 380px;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.5rem; padding: 2rem; user-select: none;
  }
  .score { text-align: center; }
  #count {
    font-size: clamp(3.5rem, 11vw, 7rem); font-weight: 800; letter-spacing: -0.03em;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  #rate { margin-top: .6rem; color: var(--muted); font-size: 1.05rem; }

  #btn {
    position: relative; width: min(60vw, 260px); aspect-ratio: 1; border: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #6573ff, var(--accent) 55%, var(--accent-deep));
    box-shadow: 0 14px 0 #1b2494, 0 28px 40px rgba(38, 49, 201, .35);
    cursor: pointer; transition: transform .07s, box-shadow .07s;
  }
  #btn:active, #btn.down { transform: translateY(10px); box-shadow: 0 4px 0 #1b2494, 0 10px 20px rgba(38, 49, 201, .35); }
  #btn:focus-visible { outline: 4px solid var(--ink); outline-offset: 8px; }
  #btn::after {
    content: ""; position: absolute; inset: 12% 22% 55% 22%; border-radius: 50%;
    background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,0));
  }
  .hint { color: var(--muted); font-size: .9rem; margin-top: -1rem; }

  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 1.75rem 1.5rem; overflow-y: auto; display: flex; flex-direction: column;
  }
  aside h2 { margin: 0 0 1.25rem; font-size: 1.25rem; }
  .buy {
    position: relative; overflow: hidden; width: 100%; text-align: left; margin-bottom: .75rem;
    padding: 1rem 1.1rem; background: var(--panel); color: var(--ink); font: inherit;
    border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer;
    display: grid; grid-template-columns: 1fr auto; gap: .15rem 1rem; align-items: center;
    transition: border-color .15s, transform .1s;
  }
  .buy .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-soft); transition: width .2s; z-index: 0; }
  .buy > *:not(.fill) { position: relative; z-index: 1; }
  .buy.ready { border-color: var(--accent); }
  .buy.ready:hover { transform: translateY(-2px); }
  .buy:not(.ready) { cursor: not-allowed; }
  .buy:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .buy .name { font-weight: 700; }
  .buy .owned { font-size: 1.5rem; font-weight: 800; color: var(--muted); grid-row: span 2; font-variant-numeric: tabular-nums; }
  .buy .desc { color: var(--muted); font-size: .9rem; }
  .buy .price { font-size: .9rem; font-weight: 600; color: var(--accent-deep); }
  #reset { margin-top: auto; align-self: flex-start; background: none; border: 0; color: var(--muted); font: inherit; font-size: .9rem; text-decoration: underline; cursor: pointer; padding: .5rem 0; }

  .pop { position: fixed; z-index: 10; pointer-events: none; font-weight: 800; font-size: 1.5rem; color: var(--accent); animation: rise .8s ease-out forwards; transform: translate(-50%, -50%); }
  @keyframes rise { to { transform: translate(-50%, -140px); opacity: 0; } }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; height: auto; }
    main { padding: 3rem 1.5rem; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pop { animation: none; opacity: 0; }
    #btn, .buy { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="score">
    <div id="count">0</div>
    <div id="rate">0 per second</div>
  </div>
  <button id="btn" aria-label="Click to earn points"></button>
  <div class="hint">Click the button or press Space</div>
</main>
<aside>
  <h2>Upgrades</h2>
  <div id="shop"></div>
  <button id="reset">Reset progress</button>
</aside>

<script>
// ---- Edit these to change the game ----
const UPGRADES = [
  { id: "finger",  name: "Stronger click", cost: 15,     perClick: 1,   perSec: 0,    desc: "+1 per click" },
  { id: "auto",    name: "Auto clicker",   cost: 60,     perClick: 0,   perSec: 1,    desc: "+1 per second" },
  { id: "double",  name: "Power gloves",   cost: 400,    perClick: 5,   perSec: 0,    desc: "+5 per click" },
  { id: "factory", name: "Factory",        cost: 1500,   perClick: 0,   perSec: 12,   desc: "+12 per second" },
  { id: "network", name: "Network",        cost: 12000,  perClick: 0,   perSec: 90,   desc: "+90 per second" },
  { id: "mega",    name: "Mega boost",     cost: 100000, perClick: 100, perSec: 600,  desc: "+100 per click, +600 per second" },
];
const COST_GROWTH = 1.15;      // each purchase costs 15% more than the last
const SAVE_KEY = "clicker-save";
// ---------------------------------------

let state = { points: 0, owned: {} };
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (saved && typeof saved.points === "number") state = saved;
} catch (e) {}

const $ = id => document.getElementById(id);
const owned = u => state.owned[u.id] || 0;
const cost = u => Math.ceil(u.cost * Math.pow(COST_GROWTH, owned(u)));
const perClick = () => 1 + UPGRADES.reduce((n, u) => n + u.perClick * owned(u), 0);
const perSec = () => UPGRADES.reduce((n, u) => n + u.perSec * owned(u), 0);
const fmt = n => {
  if (n >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (n >= 1e4) return (n / 1e3).toFixed(1) + "K";
  return Math.floor(n).toLocaleString();
};

const buttons = {};
UPGRADES.forEach(u => {
  const b = document.createElement("button");
  b.className = "buy";
  b.innerHTML = '<span class="fill"></span><span class="name"></span><span class="owned"></span><span class="desc"></span>';
  b.onclick = () => {
    if (state.points >= cost(u)) {
      state.points -= cost(u);
      state.owned[u.id] = owned(u) + 1;
      render();
    }
  };
  $("shop").appendChild(b);
  buttons[u.id] = b;
});

function render() {
  $("count").textContent = fmt(state.points);
  $("rate").textContent = fmt(perSec()) + " per second";
  UPGRADES.forEach(u => {
    const b = buttons[u.id], c = cost(u);
    b.classList.toggle("ready", state.points >= c);
    b.querySelector(".fill").style.width = Math.min(100, state.points / c * 100) + "%";
    b.querySelector(".name").textContent = u.name;
    b.querySelector(".owned").textContent = owned(u);
    b.querySelector(".desc").innerHTML = u.desc + ' · <span class="price">' + fmt(c) + '</span>';
  });
}

function click(x, y) {
  state.points += perClick();
  const p = document.createElement("div");
  p.className = "pop";
  p.textContent = "+" + fmt(perClick());
  p.style.left = x + "px";
  p.style.top = y + "px";
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 800);
  render();
}

$("btn").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  // keyboard clicks have no pointer position, so fall back to the button's center
  const x = e.detail ? e.clientX : r.left + r.width / 2;
  const y = e.detail ? e.clientY : r.top + r.height / 2;
  click(x + (Math.random() * 40 - 20), y - 20);
});

$("reset").onclick = () => {
  if (confirm("Reset all progress?")) { state = { points: 0, owned: {} }; render(); }
};

setInterval(() => { if (perSec()) { state.points += perSec() / 10; render(); } }, 100);
setInterval(() => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }, 3000);
addEventListener("beforeunload", () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} });

render();
</script>
</body>
</html>
